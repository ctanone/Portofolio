<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/menu.css"> 
  <title>Main Menu</title>
</head>
<body>
  <div class="container">
    <!-- Logo Section -->
    <div class="logo-container">
      <img src="../assets/images/pcu-logo.png" alt="Petra Christian University Logo" class="logo-image">
    </div>

    <main class="menu-content">
      <div class="menu-title">
        <h1>Welcome, <span id="username">User</span></h1>
      </div>

      <!-- GUI Boxes Section -->
      <div class="boxes-container">
        <div class="gui-box" onclick="window.location.href='document_verify.html'">
          <div class="box-icon">🔍</div>
          <h3>Verify Document</h3>
          <p>OCR + QR verification</p>
        </div>
        <div class="gui-box" onclick="window.location.href='signature.html'">
          <div class="box-icon">✍️</div>
          <h3>Signatures</h3>
          <p>Digital signature tools</p>
        </div>
        <div class="gui-box">
          <div class="box-icon">📊</div>
          <h3>Reports</h3>
          <p>View analytics & reports</p>
        </div>
        <div class="gui-box">
          <div class="box-icon">⚙️</div>
          <h3>Settings</h3>
          <p>Configure preferences</p>
        </div>
      </div>

      <!-- QR Tampering Alerts Section -->
      <div class="alerts-section">
        <div class="alerts-header">
          <h2>🔔 Security Alerts</h2>
          <span class="alert-count" id="alertCount">0</span>
        </div>
        <div class="alerts-list" id="alertsList">
          <!-- Alerts will be loaded dynamically from backend -->
          <div class="no-alerts" id="noAlertsMessage">No active security alerts.</div>
        </div>
      </div>

      <script src="../js/menu.js"></script>
    </main>
  </div>
</body>
</html>
