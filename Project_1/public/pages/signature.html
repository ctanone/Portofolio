<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signature</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="../css/signature.css">
</head>
<body>

    <header class="header">
        <div class="pcu-logo">
            <img src="../assets/images/pcu.png" alt="PCU Logo" onerror="this.style.display='none'">
        </div>
        <div class="header-title">
            <h1>Petra Christian University</h1>
            <p>Digital Signature Page</p>
        </div>
    </header>

    <section>
        <div class="text-info">
            <h1>PDF Viewer - Add & Position QR Codes</h1>
        </div>
    </section>

    <section>
        <div class="container-2">

            <!-- ── PDF Panel ─────────────────────────────────────────── -->
            <div class="pdf-view">
                <input type="file" id="pdf-file" accept="application/pdf">

                <div class="placing-indicator" id="placing-indicator">
                    🎯 Click anywhere on the PDF to place the QR code
                </div>

                <div class="pdf-controls">
                    <select id="signer-select" class="signer-select">
                        <option value="">-- Select Signer --</option>
                    </select>
                    <div class="qr-size-control">
                        <label for="qr-size-range">QR Size</label>
                        <input id="qr-size-range" type="range" min="50" max="180" value="80">
                        <span id="qr-size-value">80px</span>
                    </div>
                    <button id="add-qr-btn"          class="add-qr-btn" disabled>+ Add QR to PDF</button>
                    <button id="embed-qr-btn"         class="embed-btn">Save PDF</button>
                    <button id="reset-positions-btn"  class="reset-btn">Reset All</button>
                </div>

                <div class="pdf-pages-container" id="pdf-pages-container"></div>

                <div class="pdf-navigation">
                    <button id="prev-page-btn">← Previous</button>
                    <span id="page-info">Page 0 of 0</span>
                    <button id="next-page-btn">Next →</button>
                </div>
            </div>

            <!-- ── QR Generator Panel ────────────────────────────────── -->
            <div class="qr-generator">
                <h1>QR Code Generator - Multi Signer</h1>

                <div class="tabs-navigation">
                    <button class="tab-btn active" data-tab="signer-1">Signer 1</button>
                    <button class="add-tab-btn">+ Add Signer</button>
                </div>

                <div class="tab-content active" id="signer-1">
                    <input class="nomor" type="text" placeholder="No surat">
                    <input class="name"  type="text" placeholder="Nama">
                    <input class="id"    type="text" placeholder="NIP">
                    <div class="logo-upload-row">
                        <label class="logo-upload-label">
                            <span>Center Logo</span>
                            <input class="logo-upload" type="file" accept="image/*">
                        </label>
                        <span class="logo-filename">Using default PCU logo</span>
                    </div>
                    <div class="image qrcode-container"></div>
                    <button class="generate-btn">Generate QR Code</button>
                    <button class="download-svg-btn" type="button" disabled>Download SVG</button>
                </div>
            </div>

        </div>
    </section>

    /** Draw logo SVG centered in a white circle on an existing canvas context */
    function drawLogoOnCanvas(ctx, logoSrc, cx, cy, size) {
        return new Promise(resolve => {
            const img       = new Image();
            const centerX   = cx + size / 2;
            const centerY   = cy + size / 2;
            const circleR   = size / 2 + 2;

            img.onload = () => {
                ctx.beginPath();
                ctx.arc(centerX, centerY, circleR, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, circleR - 1, 0, 2 * Math.PI);
                ctx.clip();
                ctx.drawImage(img, cx, cy, size, size);
                ctx.restore();
                resolve();
            };

            img.onerror = () => {
                // Text fallback
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(cx - 2, cy - 2, size + 4, size + 4);
                ctx.fillStyle = '#003087';
                ctx.font = `bold ${size * 0.4}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('PCU', centerX, centerY);
                resolve();
            };

            img.src = logoSrc;
        });
    }

    /** Build a pure-SVG QR (no logo) string for download */
    function buildQrSvg(text) {
        const qrObj = qrcode(0, 'H');
        qrObj.addData(text || ' ');
        qrObj.make();

        const modules   = qrObj.getModuleCount();
        const quiet     = 4;
        const cell      = 8;
        const total     = (modules + quiet * 2) * cell;
        const rects     = [];

        for (let r = 0; r < modules; r++) {
            for (let c = 0; c < modules; c++) {
                if (!qrObj.isDark(r, c)) continue;
                rects.push(`<rect x="${(c + quiet) * cell}" y="${(r + quiet) * cell}" width="${cell}" height="${cell}"/>`);
            }
        }

        return [
            '<?xml version="1.0" encoding="UTF-8"?>',
            `<svg xmlns="http://www.w3.org/2000/svg" width="${total}" height="${total}" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges">`,
            `<rect width="${total}" height="${total}" fill="#ffffff"/>`,
            `<g fill="#000000">${rects.join('')}</g>`,
            '</svg>'
        ].join('');
    }

    /** Create a canvas copy of an existing canvas */
    function cloneCanvas(src) {
        const dst = document.createElement('canvas');
        dst.width  = src.width;
        dst.height = src.height;
        Object.assign(dst.style, { width: '100%', height: '100%', objectFit: 'contain',
                                   borderRadius: '3px', pointerEvents: 'none' });
        dst.getContext('2d').drawImage(src, 0, 0);
        return dst;
    }

    /** Place a draggable QR overlay on a PDF page container */
    function addQROverlay(pageContainer, qrCanvas, signerIdx, x, y, tab, sizePx = currentQrSizePx) {
        const overlay = document.createElement('div');
        overlay.className = 'draggable-qr';
        overlay.dataset.signerIndex = signerIdx;
        overlay.style.left = `${x}px`;
        overlay.style.top  = `${y}px`;
        overlay.style.width = `${sizePx}px`;
        overlay.style.height = `${sizePx}px`;
        overlay.appendChild(cloneCanvas(qrCanvas));

        const label = document.createElement('div');
        label.className   = 'qr-label';
        label.textContent = tab
            ? (tab.querySelector('.name').value || tab.querySelector('.id').value || `Signer ${signerIdx + 1}`)
            : `Signer ${signerIdx + 1}`;
        overlay.appendChild(label);

        const handle = document.createElement('div');
        handle.className = 'qr-resize-handle';
        overlay.appendChild(handle);

        pageContainer.appendChild(overlay);
        addDragListeners(overlay);
    }

    function redrawAllQROverlays() {
        document.querySelectorAll('.draggable-qr').forEach(el => el.remove());
        document.querySelectorAll('.tab-content').forEach((tab, i) => {
            const canvas = tab.querySelector('.qrcode-container canvas');
            const pos    = qrPositions[i];
            if (!canvas || pos === undefined) return;
            const pg = document.querySelector(`[data-page-num="${pos.pageNum}"]`);
            if (!pg) return;
            const { x, y } = ratioToPx(pos.xRatio, pos.yRatio, pg);
            const size = pos.sizeRatio ? (pos.sizeRatio * pg.getBoundingClientRect().width) : currentQrSizePx;
            addQROverlay(pg, canvas, i, x, y, tab, size);
        });
    }

    function ratioToPx(xR, yR, container) {
        const r = container.getBoundingClientRect();
        return { x: xR * r.width, y: yR * r.height };
    }

    function pxToRatio(x, y, container) {
        const r = container.getBoundingClientRect();
        return { xRatio: x / r.width, yRatio: y / r.height };
    }

    function clampPos(x, y, containerRect, sizePx) {
        return {
            x: Math.max(0, Math.min(x, containerRect.width  - sizePx)),
            y: Math.max(0, Math.min(y, containerRect.height - sizePx))
        };
    }

    function clampSize(sizePx) {
        return Math.max(QR_MIN_PX, Math.min(QR_MAX_PX, sizePx));
    }

        const nomor        = tab.querySelector('.nomor').value;
        const name         = tab.querySelector('.name').value;
        const id           = tab.querySelector('.id').value;
        const container    = tab.querySelector('.qrcode-container');
        const dlBtn        = tab.querySelector('.download-svg-btn');
        const qrText       = `https://petra.ac.id?nomor=${encodeURIComponent(nomor)}&name=${encodeURIComponent(name)}&id=${encodeURIComponent(id)}`;

        container.innerHTML = '';
        tab.dataset.qrSvg   = buildQrSvg(qrText);
        if (dlBtn) dlBtn.disabled = false;

        new QRCode(container, {
            text: qrText || ' ', width: QR_CANVAS_PX, height: QR_CANVAS_PX,
            colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H
        });

        // Await logo draw so overlay copy is always complete
        tab._logoReady = new Promise(resolve => {
            setTimeout(async () => {
                const canvas = container.querySelector('canvas');
                if (!canvas) { resolve(); return; }
                const ctx    = canvas.getContext('2d');
                const cx     = (canvas.width  - LOGO_SIZE) / 2;
                const cy     = (canvas.height - LOGO_SIZE) / 2;
                const upload = tab.querySelector('.logo-upload');
                const src    = (upload && upload.dataset.logoDataUrl) || PCU_LOGO_SRC;
                await drawLogoOnCanvas(ctx, src, cx, cy, LOGO_SIZE);
                resolve();
            }, 150);
        });

        updateSignerSelect();
    });

    // ── Download SVG ─────────────────────────────────────────────────────────

    document.addEventListener('click', e => {
        if (!e.target.classList.contains('download-svg-btn')) return;
        const tab = e.target.closest('.tab-content');
        if (!tab?.dataset.qrSvg) { alert('Please generate QR code first'); return; }

        const name = (tab.querySelector('.name').value || 'signer')
            .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'signer';
        const blob = new Blob([tab.dataset.qrSvg], { type: 'image/svg+xml' });
        const a    = Object.assign(document.createElement('a'), {
            href: URL.createObjectURL(blob), download: `${name}-qr.svg`
        });
        a.click();
        URL.revokeObjectURL(a.href);
    });

    // ── PDF rendering ─────────────────────────────────────────────────────────

    document.getElementById('pdf-file').addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        pdfFile = file;
        qrPositions  = {};
        currentPageNum = 0;
        await renderAllPages(URL.createObjectURL(file));
        document.getElementById('add-qr-btn').disabled = false;
    });

    async function renderAllPages(url) {
        try {
            pdfDocObj  = await pdfjsLib.getDocument(url).promise;
            totalPages = pdfDocObj.numPages;
            const container = document.getElementById('pdf-pages-container');
            container.innerHTML = '';

            for (let n = 1; n <= totalPages; n++) {
                const page     = await pdfDocObj.getPage(n);
                const viewport = page.getViewport({ scale: RENDER_SCALE });
                const canvas   = document.createElement('canvas');
                canvas.width   = viewport.width;
                canvas.height  = viewport.height;
                canvas.dataset.pdfWidth  = page.getViewport({ scale: 1 }).width;
                canvas.dataset.pdfHeight = page.getViewport({ scale: 1 }).height;

                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

                const pg = Object.assign(document.createElement('div'), {
                    className: 'pdf-page-item'
                });
                pg.dataset.pageNum = n - 1;
                pg.style.position  = 'relative';
                pg.appendChild(canvas);
                container.appendChild(pg);
            }
            redrawAllQROverlays();
            updatePageInfo();
        } catch (err) {
            console.error('PDF load error:', err);
            alert('Error loading PDF: ' + err.message);
        }
    }

    // ── QR Placement ─────────────────────────────────────────────────────────

    document.getElementById('add-qr-btn').addEventListener('click', () => {
        const idx = document.getElementById('signer-select').value;
        if (idx === '') { alert('Please select a signer'); return; }
        const tab = document.getElementById(`signer-${+idx + 1}`);
        if (!tab.querySelector('.qrcode-container canvas')) { alert('Please generate QR code first'); return; }
        selectedSigner = +idx;
        setPlacingMode(true);
    });

    async function placeQrAtPointer(e) {
        if (!isAddingQR) return;
        const pg = e.target.closest('.pdf-page-item');
        if (!pg) return;

        const rect        = pg.getBoundingClientRect();
        const { x, y }   = clampPos(e.clientX - rect.left - currentQrSizePx / 2,
                                     e.clientY - rect.top  - currentQrSizePx / 2,
                                     rect, currentQrSizePx);
        const pageNum     = +pg.dataset.pageNum;
        const { xRatio, yRatio } = pxToRatio(x, y, pg);

        qrPositions[selectedSigner] = {
            xRatio,
            yRatio,
            pageNum,
            sizeRatio: currentQrSizePx / rect.width
        };

        const tab = document.getElementById(`signer-${selectedSigner + 1}`);
        if (tab._logoReady) await tab._logoReady;

        const canvas = tab.querySelector('.qrcode-container canvas');
        document.querySelectorAll(`.draggable-qr[data-signer-index="${selectedSigner}"]`).forEach(el => el.remove());
        addQROverlay(pg, canvas, selectedSigner, x, y, tab, currentQrSizePx);

        selectedSigner = null;
        setPlacingMode(false);
    }

    document.getElementById('pdf-pages-container').addEventListener('pointerdown', placeQrAtPointer);
    document.getElementById('pdf-pages-container').addEventListener('click',       placeQrAtPointer);

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && isAddingQR) { selectedSigner = null; setPlacingMode(false); }
    });

    // ── Drag & Drop ───────────────────────────────────────────────────────────

    function addDragListeners(el) {
        el.addEventListener('mousedown', e => {
            if (isAddingQR) return;
            if (e.target.classList.contains('qr-resize-handle')) {
                isResizing      = true;
                draggingQR      = el;
                resizeStartSize = el.getBoundingClientRect().width;
                resizeStartX    = e.clientX;
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            isDragging  = true;
            draggingQR  = el;
            dragOffsetX = e.clientX - el.getBoundingClientRect().left;
            dragOffsetY = e.clientY - el.getBoundingClientRect().top;
            el.style.zIndex     = '1000';
            el.style.transition = 'none';
            e.preventDefault();
            e.stopPropagation();
        });
    }

    document.addEventListener('mousemove', e => {
        if (isResizing && draggingQR) {
            const pg = draggingQR.closest('.pdf-page-item');
            if (!pg) return;
            const rect = pg.getBoundingClientRect();
            const proposed = clampSize(resizeStartSize + (e.clientX - resizeStartX));
            const x = parseFloat(draggingQR.style.left);
            const y = parseFloat(draggingQR.style.top);
            const clamped = clampPos(x, y, rect, proposed);
            draggingQR.style.width = `${proposed}px`;
            draggingQR.style.height = `${proposed}px`;
            draggingQR.style.left = `${clamped.x}px`;
            draggingQR.style.top = `${clamped.y}px`;
            return;
        }

        if (!isDragging || !draggingQR) return;
        const pg   = draggingQR.closest('.pdf-page-item');
        if (!pg) return;
        const rect = pg.getBoundingClientRect();
        const size = parseFloat(draggingQR.style.width) || currentQrSizePx;
        const { x, y } = clampPos(e.clientX - rect.left - dragOffsetX,
                                   e.clientY - rect.top  - dragOffsetY,
                                   rect, size);
        draggingQR.style.left = `${x}px`;
        draggingQR.style.top  = `${y}px`;
    });

    document.addEventListener('mouseup', () => {
        if ((!isDragging && !isResizing) || !draggingQR) return;
        const idx = +draggingQR.dataset.signerIndex;
        const pg  = draggingQR.closest('.pdf-page-item');
        const pgRect = pg.getBoundingClientRect();
        const sizePx = parseFloat(draggingQR.style.width) || currentQrSizePx;
        qrPositions[idx] = {
            ...pxToRatio(+draggingQR.style.left.replace('px',''),
                         +draggingQR.style.top.replace('px',''), pg),
            pageNum: +pg.dataset.pageNum,
            sizeRatio: sizePx / pgRect.width
        };
        currentQrSizePx = clampSize(sizePx);
        qrSizeRangeEl.value = String(currentQrSizePx);
        qrSizeValueEl.textContent = `${currentQrSizePx}px`;
        draggingQR.style.zIndex = draggingQR.style.transition = '';
        isDragging = false;
        isResizing = false;
        draggingQR = null;
    });

    // ── Navigation ────────────────────────────────────────────────────────────

    document.getElementById('prev-page-btn').addEventListener('click', () => {
        if (currentPageNum > 0) { currentPageNum--; updatePageInfo(); scrollToPage(); }
    });
    document.getElementById('next-page-btn').addEventListener('click', () => {
        if (currentPageNum < totalPages - 1) { currentPageNum++; updatePageInfo(); scrollToPage(); }
    });
    function updatePageInfo() {
        document.getElementById('page-info').textContent = `Page ${currentPageNum + 1} of ${totalPages}`;
    }
    function scrollToPage() {
        document.querySelector(`[data-page-num="${currentPageNum}"]`)?.scrollIntoView({ behavior: 'smooth' });
    }

    // ── Reset ─────────────────────────────────────────────────────────────────

    document.getElementById('reset-positions-btn').addEventListener('click', () => {
        if (!confirm('Reset all QR positions?')) return;
        qrPositions = {};
        document.querySelectorAll('.draggable-qr').forEach(el => el.remove());
    });

    // ── Save PDF ──────────────────────────────────────────────────────────────

    document.getElementById('embed-qr-btn').addEventListener('click', async () => {
        if (!pdfFile) { alert('Please upload a PDF first'); return; }
        if (!Object.keys(qrPositions).length) { alert('Please add at least one QR code'); return; }

        try {
            const { PDFDocument } = PDFLib;
            const doc      = await PDFDocument.load(await pdfFile.arrayBuffer());
            const pages    = doc.getPages();
            const tabs     = document.querySelectorAll('.tab-content');

            for (let i = 0; i < tabs.length; i++) {
                const pos    = qrPositions[i];
                if (!pos) continue;
                const canvas = tabs[i].querySelector('.qrcode-container canvas');
                if (!canvas) continue;

                const page              = pages[pos.pageNum];
                const { width: pdfW, height: pdfH } = page.getSize();
                const sizeRatio         = pos.sizeRatio || (QR_DEFAULT_PX / QR_CANVAS_PX);
                const size              = Math.max(pdfW * 0.04, Math.min(pdfW * sizeRatio, pdfW * 0.35));
                const x                 = pos.xRatio * pdfW;
                const y                 = pdfH - pos.yRatio * pdfH - size;
                const img               = await doc.embedPng(canvas.toDataURL('image/png'));

                page.drawImage(img, {
                    x: Math.max(0, Math.min(x, pdfW - size)),
                    y: Math.max(0, Math.min(y, pdfH - size)),
                    width: size, height: size
                });
            }

            const blob = new Blob([await doc.save()], { type: 'application/pdf' });
            const a    = Object.assign(document.createElement('a'), {
                href: URL.createObjectURL(blob), download: 'signed-document.pdf'
            });
            a.click();
            URL.revokeObjectURL(a.href);

        } catch (err) {
            console.error('Save error:', err);
            alert('Error saving PDF: ' + err.message);
        }
    });

    </script>
</body>
</html>
